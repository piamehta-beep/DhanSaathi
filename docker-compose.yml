services:
  db:
    image: postgres:16
    container_name: dhansaathi_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dhansaathi
      POSTGRES_PASSWORD: dhansaathi
      POSTGRES_DB: dhansaathi
    ports:
      - "5433:5432"
    volumes:
      - dhansaathi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dhansaathi -d dhansaathi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dhansaathi_pgdata:
